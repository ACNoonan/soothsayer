[package]
name = "soothsayer-verify"
description = "Independent third-party verifier for Soothsayer's published band coverage claims"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
libm = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
soothsayer-consumer = { path = "../soothsayer-consumer" }
